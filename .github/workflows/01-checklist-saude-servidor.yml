name: Projeto 01 - Checklist de Saúde do Servidor

on:
  workflow_dispatch:

jobs:
  health-check:
    name: Coletar evidências do sistema
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Executar checklist de saúde do servidor
        run: |
          chmod +x 01-checklist-saude-servidor/check_server.sh
          ./01-checklist-saude-servidor/check_server.sh | tee relatorio-saude-servidor.txt

      - name: Salvar relatório como artefato (.txt)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-saude-servidor
          path: relatorio-saude-servidor.txt
          retention-days: 7
